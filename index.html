<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>色をつくる｜minohi design</title>
  <meta name="description" content="スマホケースの色と名入れの文字色を、C・M・Y・K の数値でつくれます。決まった内容はそのままコピーできます。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --surround: #FFFFFF;
      --paper: #FFFFFF;
      --ink: #2B3238;
      --muted: #79838B;
      --line: #DDDDDC;
      --field: #F2F2F1;
      --focus: #5E7E97;
      --copied: #5E7E97;
      --bk: #fbfbfb;
      --shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0;
      background: var(--bk);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    h2,
    h3,
    h4,
    p {
      margin: 0
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 20px calc(48px + env(safe-area-inset-bottom))
    }

    /* ---------- header ---------- */
    .logo {
      display: block;
      width: 124px;
      height: auto;
      margin: 0 auto
    }

    .lede {
      margin-top: 22px;
      max-width: 36em;
      font-size: 1rem;
      line-height: 1.9;
      letter-spacing: .02em;
      color: var(--muted)
    }

    /* ---------- preview (sticky) ---------- */
    .viewer {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 14px 0 16px;
      background: var(--surround);
    }

    .case {
      position: relative;
      width: 100%;
      height: clamp(104px, 19vh, 168px);
      border-radius: 10px;
      overflow: hidden;
      container-type: inline-size;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .14);
    }

    .case-half {
      width: 100%;
      height: 100%;
      background: #fff;
    }

    .engrave {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8%;
      text-align: center;
      font-size: 18px;
      font-size: clamp(15px, 4.5cqw, 26px);
      line-height: 1.35;
      letter-spacing: .04em;
      word-break: break-word;
      pointer-events: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #FFFFFF;
    }

    .readout {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
      gap: 14px 18px;
      margin-top: 14px;
    }

    .half-name {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: .8125rem;
      font-weight: 500;
      letter-spacing: .06em;
      color: var(--muted);
    }

    .dot {
      flex: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18);
    }

    /* 読み出し側の丸はスクリーンショットからスポイトで拾うため大きめ */
    .readout .dot {
      width: 30px;
      height: 30px;
    }

    /* ---------- groups ---------- */
    .group+.group {
      margin-top: 22px
    }

    .group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: .9375rem;
      font-weight: 500;
      letter-spacing: .06em;
    }

    .controls {
      padding: 8px 16px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px
    }

    .row {
      display: grid;
      grid-template-columns: 1.1rem 4.4em minmax(0, 1fr);
      column-gap: 10px;
      align-items: center;
      padding: 5px 0
    }

    .row+.row {
      border-top: 1px solid var(--line)
    }

    .row .ch {
      font-size: .9rem;
      font-weight: 600
    }

    .row .name {
      font-size: .8125rem;
      letter-spacing: .04em;
      color: var(--muted)
    }

    .rng {
      width: 100%;
      height: 36px;
      margin: 0;
      background: transparent;
      -webkit-appearance: none;
      appearance: none
    }

    .rng::-webkit-slider-runnable-track {
      height: 12px;
      border-radius: 999px;
      background: var(--track, #eee);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12)
    }

    .rng::-moz-range-track {
      height: 12px;
      border-radius: 999px;
      background: var(--track, #eee);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12)
    }

    .rng::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      margin-top: -7px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, .2);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .25)
    }

    .rng::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, .2);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .25)
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      min-height: 54px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      font-size: .9375rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-align: left;
    }

    .toggle-box {
      position: relative;
      flex: none;
      width: 20px;
      height: 20px;
      border: 1px solid var(--muted);
      border-radius: 4px;
    }

    .toggle[aria-pressed="true"] {
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink);
    }

    .toggle[aria-pressed="true"] .toggle-box {
      background: var(--ink);
      border-color: var(--ink);
    }

    .toggle[aria-pressed="true"] .toggle-box::after {
      content: '';
      position: absolute;
      left: 6px;
      top: 2px;
      width: 5px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .eng-panel {
      margin-top: 12px
    }

    .eng-panel[hidden],
    .half[hidden] {
      display: none
    }

    .limit {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--field);
      font-size: .875rem;
      line-height: 1.9;
      letter-spacing: .03em
    }

    .limit[hidden] {
      display: none
    }

    /* ---------- actions ---------- */
    .save {
      display: block;
      width: 100%;
      margin-top: 22px;
      min-height: 52px;
      padding: 0 20px;
      border: 0;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      font-size: .9375rem;
      font-weight: 500;
      letter-spacing: .06em;
      transition: background .15s ease;
    }

    .save:hover {
      background: #3A434A
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 1.8em;
      margin-top: 8px
    }

    .status {
      font-size: .8125rem;
      letter-spacing: .03em;
      color: var(--copied)
    }

    .reset {
      padding: 4px 0;
      border: 0;
      background: none;
      font-size: .8125rem;
      letter-spacing: .04em;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      white-space: nowrap;
      margin: 0 auto;
    }

    .reset:hover {
      color: var(--ink)
    }

    /* ---------- note ---------- */
    .note {
      margin-top: 28px;
      padding: 30px;
      background: var(--paper);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    .note h2 {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: .06em
    }

    .note p {
      margin-top: 12px;
      font-size: 1rem;
      line-height: 1.95;
      letter-spacing: .02em;
      color: var(--muted)
    }

    .foot {
      margin-top: 28px;
      text-align: center;
      font-size: .8125rem;
      letter-spacing: .08em;
      color: var(--muted)
    }

    :where(button, input, a):focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px
    }

    .grid {
      padding: 30px;
      background: white;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: var(--shadow);
    }

    @media (min-width:880px) {
      .wrap {
        padding: 40px 40px 64px
      }

      .logo {
        width: 148px
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 48px;
        align-items: start;
        margin-top: 40px;
      }

      .viewer {
        top: 24px;
        padding-top: 0
      }

      .case {
        height: clamp(130px, 20vh, 190px);
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }
  </style>
</head>

<body>

  <div class="wrap">
    <header>
      <img class="logo" src="logo.svg" width="368" height="189" alt="minohi design">
    </header>

    <main class="grid">
      <section class="viewer">
        <div class="preview">
          <div class="case">
            <div class="case-half" id="caseTop"></div>
            <div class="engrave" id="engrave"></div>
          </div>

          <div class="readout">
            <div class="half">
              <p class="half-name"><span class="dot" id="dotT"></span>ケースの色</p>
            </div>
            <div class="half" id="readX" hidden>
              <p class="half-name"><span class="dot" id="dotX"></span>文字色</p>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">

        <div class="group">
          <h3 class="group-head"><span class="dot" id="dotHeadT"></span>ケースの色</h3>
          <div class="controls">
            <div class="row">
              <label class="ch" for="stc">C</label>
              <span class="name">シアン</span>
              <input class="rng" id="stc" type="range" min="0" max="100" step="1" value="0" aria-label="ケース シアン">
            </div>
            <div class="row">
              <label class="ch" for="stm">M</label>
              <span class="name">マゼンタ</span>
              <input class="rng" id="stm" type="range" min="0" max="100" step="1" value="0" aria-label="ケース マゼンタ">
            </div>
            <div class="row">
              <label class="ch" for="sty">Y</label>
              <span class="name">イエロー</span>
              <input class="rng" id="sty" type="range" min="0" max="100" step="1" value="0" aria-label="ケース イエロー">
            </div>
            <div class="row">
              <label class="ch" for="stk">K</label>
              <span class="name">ブラック</span>
              <input class="rng" id="stk" type="range" min="0" max="100" step="1" value="0" aria-label="ケース ブラック">
            </div>
            <p class="limit" id="limitT" hidden></p>
          </div>
        </div>

        <div class="group">
          <p  style="margin-bottom: 10px;">名入れをご希望の方は以下にチェックを入れて、文字色を作成してください。</p>
          <button class="toggle" id="engToggle" type="button" aria-pressed="false" aria-controls="engPanel">
            <span class="toggle-box" aria-hidden="true"></span>名入れをする
          </button>
          <div class="eng-panel" id="engPanel" hidden>
            <h3 class="group-head"><span class="dot" id="dotHeadX"></span>名入れの文字色</h3>
            <div class="controls">
            <div class="row">
              <label class="ch" for="sxc">C</label>
              <span class="name">シアン</span>
              <input class="rng" id="sxc" type="range" min="0" max="100" step="1" value="0" aria-label="文字 シアン">
            </div>
            <div class="row">
              <label class="ch" for="sxm">M</label>
              <span class="name">マゼンタ</span>
              <input class="rng" id="sxm" type="range" min="0" max="100" step="1" value="0" aria-label="文字 マゼンタ">
            </div>
            <div class="row">
              <label class="ch" for="sxy">Y</label>
              <span class="name">イエロー</span>
              <input class="rng" id="sxy" type="range" min="0" max="100" step="1" value="0" aria-label="文字 イエロー">
            </div>
            <div class="row">
              <label class="ch" for="sxk">K</label>
              <span class="name">ブラック</span>
              <input class="rng" id="sxk" type="range" min="0" max="100" step="1" value="0" aria-label="文字 ブラック">
            </div>
              <p class="limit" id="limitX" hidden></p>
            </div>
          </div>
        </div>

        <button class="save" id="saveBtn" type="button">画像として保存</button>
        <div class="actions">
          <p class="status" id="status" role="status" aria-live="polite"></p>
          <button class="reset" id="reset" type="button">色をリセットする</button>
        </div>
      </section>
    </main>


    <p class="foot">&copy; minohi design</p>
  </div>

  <noscript>
    <p style="padding:20px;font-size:.8125rem">このページを使うには JavaScript を有効にしてください。</p>
  </noscript>

  <script>
    (function () {

      /* ------------------------------------------------------------------
         インキのベタ色（sRGB）。ここの数値を直せば発色を調整できます。
         一般的なプロセスインキ（Japan Color 相当）の値。
      ------------------------------------------------------------------ */
      var INK = {
        w: [255, 255, 255],  /* 紙白           */
        c: [0, 160, 233],  /* C100           */
        m: [228, 0, 127],  /* M100           */
        y: [255, 241, 0],  /* Y100           */
        cm: [29, 32, 136],  /* C100 M100      */
        cy: [0, 153, 68],  /* C100 Y100      */
        my: [230, 0, 18],  /* M100 Y100      */
        cmy: [55, 47, 45],  /* C100 M100 Y100 */
        k: [35, 24, 21]   /* K100           */
      };

      var CH = ['c', 'm', 'y', 'k'];
      /* id はHTMLの要素IDの接頭辞。face が null のものはケースの面ではなく文字の色 */
      var SETS = [
        { id: 't', label: 'ケースの色', face: 'caseTop', init: { c: 0, m: 0, y: 0, k: 0 } },
        { id: 'x', label: '文字', face: null, init: { c: 0, m: 0, y: 0, k: 0 } }
      ];

      var state = {};
      SETS.forEach(function (s) {
        state[s.id] = { c: s.init.c, m: s.init.m, y: s.init.y, k: s.init.k };
      });
      var engOn = false;
      var touched = false;

      var el = {};
      SETS.forEach(function (s) {
        var up = s.id.toUpperCase();
        el[s.id] = { ch: {} };
        CH.forEach(function (k) {
          el[s.id].ch[k] = {
            rng: document.getElementById('s' + s.id + k)
          };
        });
        el[s.id].face = s.face ? document.getElementById(s.face) : null;
        el[s.id].dots = [
          document.getElementById('dot' + up),
          document.getElementById('dotHead' + up)
        ];
        el[s.id].limit = document.getElementById('limit' + up);
      });

      var engrave = document.getElementById('engrave');
      var engToggle = document.getElementById('engToggle');
      var engPanel = document.getElementById('engPanel');
      var readX = document.getElementById('readX');
      var status = document.getElementById('status');
      var saveBtn = document.getElementById('saveBtn');
      var reset = document.getElementById('reset');

      function clamp(n) { return Math.max(0, Math.min(100, n)); }

      /* CMY はノイゲバウア式（8通りの重なりを面積比で混ぜる）、
         K はその上への刷り重ねとして乗算する。                  */
      function toRgb(s) {
        var c = s.c / 100, m = s.m / 100, y = s.y / 100, k = s.k / 100;
        var prim = [INK.w, INK.c, INK.m, INK.y, INK.cm, INK.cy, INK.my, INK.cmy];
        var area = [
          (1 - c) * (1 - m) * (1 - y),
          c * (1 - m) * (1 - y),
          (1 - c) * m * (1 - y),
          (1 - c) * (1 - m) * y,
          c * m * (1 - y),
          c * (1 - m) * y,
          (1 - c) * m * y,
          c * m * y
        ];
        var out = [0, 0, 0], i, j;
        for (i = 0; i < 8; i++) {
          for (j = 0; j < 3; j++) out[j] += area[i] * prim[i][j];
        }
        for (j = 0; j < 3; j++) {
          var t = 1 - k * (1 - INK.k[j] / 255);
          out[j] = Math.round(Math.max(0, Math.min(255, out[j] * t)));
        }
        return out;
      }

      function cssOf(a) { return 'rgb(' + a[0] + ',' + a[1] + ',' + a[2] + ')'; }

      /* 他を固定すれば各チャンネルは線形なので、2点の gradient で正確に描ける */
      function trackOf(id, k) {
        var s = state[id];
        var lo = { c: s.c, m: s.m, y: s.y, k: s.k };
        var hi = { c: s.c, m: s.m, y: s.y, k: s.k };
        lo[k] = 0; hi[k] = 100;
        return 'linear-gradient(90deg,' + cssOf(toRgb(lo)) + ' 0%,' + cssOf(toRgb(hi)) + ' 100%)';
      }

      var hashTimer;
      function queueHash() {
        if (!touched) return;
        clearTimeout(hashTimer);
        hashTimer = setTimeout(function () {
          var parts = SETS.map(function (s) {
            return s.id + '=' + CH.map(function (k) { return state[s.id][k]; }).join(',');
          });
          if (engOn) parts.push('e=1');
          try { history.replaceState(null, '', '#' + parts.join('&')); } catch (e) { }
        }, 300);
      }

      function render() {
        SETS.forEach(function (s) {
          var id = s.id;
          var col = cssOf(toRgb(state[id]));
          if (el[id].face) el[id].face.style.background = col;
          el[id].dots.forEach(function (d) { if (d) d.style.background = col; });

          CH.forEach(function (k) {
            var c = el[id].ch[k];
            var v = String(state[id][k]);
            c.rng.style.setProperty('--track', trackOf(id, k));
            if (c.rng.value !== v) c.rng.value = v;
          });

          var total = CH.reduce(function (sum, k) { return sum + state[id][k]; }, 0);
          if (total > 300) {
            el[id].limit.textContent = 'インクの合計が ' + total + '% です。300% を超えると、印刷の仕上がりが不安定になることがあります。';
            el[id].limit.hidden = false;
          } else {
            el[id].limit.hidden = true;
          }
        });

        engToggle.setAttribute('aria-pressed', engOn ? 'true' : 'false');
        engPanel.hidden = !engOn;
        readX.hidden = !engOn;
        engrave.textContent = engOn ? 'Sample' : '';
        engrave.style.color = cssOf(toRgb(state.x));

        queueHash();
      }

      SETS.forEach(function (s) {
        var id = s.id;
        CH.forEach(function (k) {
          var c = el[id].ch[k];
          c.rng.addEventListener('input', function (e) {
            touched = true;
            state[id][k] = clamp(parseInt(e.target.value, 10) || 0);
            render();
          });
        });
      });

      engToggle.addEventListener('click', function () {
        engOn = !engOn;
        touched = true;
        render();
      });

      var flashTimer;
      function flash(msg) {
        status.textContent = msg;
        clearTimeout(flashTimer);
        flashTimer = setTimeout(function () { status.textContent = ''; }, 2600);
      }

      /* ---- プレビューを PNG として書き出す ---------------------------
         スクリーンショットと違い、端末のカラープロファイルの影響を受けない
         タグなし sRGB の画像になる。スポイトで拾う色が環境に左右されない。
      ------------------------------------------------------------------ */
      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function buildCanvas() {
        var S = 2, PAD = 28, W = 560;
        var D = 96, G = 28, LH = 30;
        var caseW = W - PAD * 2, caseH = 190, caseX = PAD, caseY = PAD, R = 12;
        var sw = [{ label: 'ケースの色', color: cssOf(toRgb(state.t)) }];
        if (engOn) sw.push({ label: '文字色', color: cssOf(toRgb(state.x)) });

        var swY = caseY + caseH + 34;
        var H = swY + D + LH + PAD;

        var cv = document.createElement('canvas');
        cv.width = W * S;
        cv.height = H * S;
        var ctx = cv.getContext('2d');
        ctx.scale(S, S);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        roundRect(ctx, caseX, caseY, caseW, caseH, R);
        ctx.clip();
        ctx.fillStyle = cssOf(toRgb(state.t));
        ctx.fillRect(caseX, caseY, caseW, caseH);
        if (engOn) {
          ctx.fillStyle = cssOf(toRgb(state.x));
          ctx.font = '500 24px "Plus Jakarta Sans", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('Sample', caseX + caseW / 2, caseY + caseH / 2);
        }
        ctx.restore();
        ctx.strokeStyle = 'rgba(0,0,0,.14)';
        ctx.lineWidth = 1;
        roundRect(ctx, caseX + .5, caseY + .5, caseW - 1, caseH - 1, R);
        ctx.stroke();

        var total = sw.length * D + (sw.length - 1) * G;
        var x0 = (W - total) / 2;
        ctx.textAlign = 'center';
        sw.forEach(function (s, i) {
          var cx = x0 + i * (D + G) + D / 2, cy = swY + D / 2;
          ctx.beginPath();
          ctx.arc(cx, cy, D / 2, 0, Math.PI * 2);
          ctx.fillStyle = s.color;
          ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,.18)';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.fillStyle = '#79838B';
          ctx.font = '400 13px "Noto Sans JP", sans-serif';
          ctx.textBaseline = 'top';
          ctx.fillText(s.label, cx, swY + D + 10);
        });
        return cv;
      }

      /* スマホ・タブレットだけ共有シートを使う。
         PC のブラウザも Web Share API に対応しているため、端末で分岐する。 */
      function isHandheld() {
        var ua = navigator.userAgent || '';
        if (/Android|iPhone|iPod|iPad/i.test(ua)) return true;
        /* iPadOS 13 以降は Macintosh を名乗るのでタッチ点数で判別 */
        if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return true;
        return false;
      }

      function saveImage() {
        var cv = buildCanvas();
        var d = new Date();
        function pad2(n) { return (n < 10 ? '0' : '') + n; }
        var name = 'minohi-color-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate())
          + '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.png';

        /* ユーザー操作の文脈を保つため同期的に Blob を作る（共有APIの制約） */
        var url = cv.toDataURL('image/png');
        var bin = atob(url.split(',')[1]);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        var blob = new Blob([arr], { type: 'image/png' });

        try {
          var file = new File([blob], name, { type: 'image/png' });
          if (isHandheld() && navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file] }).catch(function () { });
            return;
          }
        } catch (e) { }

        var obj = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = obj;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(obj); }, 1000);
        flash('画像を保存しました');
      }

      saveBtn.addEventListener('click', saveImage);

      reset.addEventListener('click', function () {
        SETS.forEach(function (s) {
          CH.forEach(function (k) { state[s.id][k] = s.init[k]; });
        });
        engOn = false;
        touched = false;
        clearTimeout(hashTimer);
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
        render();
        flash('最初の状態に戻しました');
      });

      (function init() {
        var h = location.hash.replace(/^#/, '');
        if (h) {
          var p = new URLSearchParams(h);
          SETS.forEach(function (s) {
            var v = p.get(s.id);
            if (!v) return;
            var parts = v.split(',');
            CH.forEach(function (k, i) {
              var n = parseInt(parts[i], 10);
              if (!isNaN(n)) { state[s.id][k] = clamp(n); touched = true; }
            });
          });
          if (p.get('e') === '1') { engOn = true; touched = true; }
        }
        render();
      })();
    })();
  </script>
</body>

</html>
